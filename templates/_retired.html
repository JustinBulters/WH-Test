{% if group.retired_at %}
<div class="flash error">
  Uitgevallen op {{ group.retired_at|localtime }}{% if group.retired_cp %} bij CP {{ group.retired_cp }}{% endif %}.
  {% if me.role == 'admin' %}
  <form method="post" action="{{ url_for('group_retire', gid=group.id) }}" class="inline">
    <input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="undo" value="1"><input type="hidden" name="back" value="{{ back }}">
    <button class="ghost">Ongedaan maken</button>
  </form>
  {% endif %}
</div>
{% endif %}
