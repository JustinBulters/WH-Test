{% extends "base.html" %}{% block title %}Wachtwoord{% endblock %}
{% block content %}
<h1>Wachtwoord wijzigen</h1>
<form method="post">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <div class="row"><label>Huidig wachtwoord<input name="old" type="password" autocomplete="current-password" required></label></div>
  <div class="row"><label>Nieuw wachtwoord (min. 8 tekens)<input name="new" type="password" autocomplete="new-password" minlength="8" required></label></div>
  <button>Opslaan</button>
</form>
{% endblock %}
