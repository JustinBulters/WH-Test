{% extends "base.html" %}{% block title %}Meldingen{% endblock %}
{% block content %}
<h1>Meldingen</h1>
{% if unread %}<form method="post" action="{{ url_for('notifications_read') }}" class="actions" style="margin:0 0 1rem"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="alt">Alles gelezen</button></form>{% endif %}
<div class="panel"><ul class="people notes">
{% for n in rows %}
<li{% if not n.read_at %} class="new"{% endif %}><a href="{{ url_for('notification_open', nid=n.id) }}">{{ n.text }}</a><br><span class="muted">{{ n.at|localtime }}</span></li>
{% else %}<li class="muted">Nog geen meldingen.</li>{% endfor %}
</ul></div>
{% endblock %}
