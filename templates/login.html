{% extends "base.html" %}{% block title %}Inloggen{% endblock %}
{% block content %}
<h1>Inloggen</h1>
<form method="post">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <div class="row"><label>Gebruikersnaam<input name="username" autocomplete="username" autocapitalize="none" required autofocus></label></div>
  <div class="row"><label>Wachtwoord<input name="password" type="password" autocomplete="current-password" required></label></div>
  <button class="big">Inloggen</button>
</form>
{% endblock %}
