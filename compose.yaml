# Run the hike site on a Synology NAS (Container Manager > Project) or any Docker host.
# Every merge to main builds a new image on GitHub; the updater below picks it up.
name: wh-hike

services:
  web:
    image: ghcr.io/justinbulters/wh-test:latest
    pull_policy: always                     # building the project always fetches the newest version
    restart: unless-stopped
    ports:
      - "9999:8000"                         # NAS port 9999 -> site
    environment:
      # Read from a .env file next to this file on the NAS (never commit it):
      #   WH_ADMIN_PASSWORD=your-password
      # Only used the very first time, to create the admin account.
      WH_ADMIN_PASSWORD: ${WH_ADMIN_PASSWORD:-}
      # WH_HTTPS: "1"                       # turn on once you only open the site via https://
    volumes:
      - data:/data                          # database and session key, kept across updates

  # Checks GitHub for a newer version right away and then every 2 minutes, and restarts
  # the site only when there is one. Its Log tab in Container Manager shows each check.
  updater:
    image: docker:27-cli
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/compose:ro                      # this project folder, so the updater can read this file
    command:
      - sh
      - -c
      - >-
        while true; do
        echo "$$(date '+%F %T') controleren op nieuwe versie";
        docker compose -p wh-hike --project-directory /compose pull web &&
        docker compose -p wh-hike --project-directory /compose up -d --no-deps web;
        sleep 120;
        done

volumes:
  data:
